<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pickleball Scheduler</title>
<style>
  :root {
    --green: #b8860b;
    --green-dark: #8b6508;
    --green-pale: #fbf3dc;
    --green-pale-border: #e3cd8e;
    --bg: #eef1f4;
    --card-border: #d7dce2;
    --text: #1f2937;
    --muted: #6b7280;
    --dark-cell: #241c10;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    padding: 32px 16px 80px;
  }
  .app {
    max-width: 640px;
    margin: 0 auto;
  }
  h1 {
    text-align: center;
    color: var(--green);
    font-size: 2rem;
    margin: 8px 0 28px;
  }
  label.section-label {
    display: block;
    font-weight: 700;
    font-size: 0.95rem;
    margin: 18px 0 8px;
  }
  input[type="text"], input[type="number"] {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid var(--card-border);
    border-radius: 10px;
    font-size: 1rem;
    background: #fff;
    color: var(--text);
  }
  input[type="text"]:focus, input[type="number"]:focus {
    outline: 2px solid var(--green);
    outline-offset: 1px;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }
  .chip {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #fff;
    border: 1px solid var(--card-border);
    border-radius: 999px;
    padding: 6px 8px 6px 14px;
    font-size: 0.9rem;
  }
  .chip button {
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
    padding: 2px 6px;
    border-radius: 50%;
  }
  .chip button:hover { background: #f1f1f1; color: #c0392b; }

  .dropdown { margin-top: 12px; }
  .dropdown-toggle {
    width: 100%;
    text-align: left;
    background: var(--green-pale);
    border: 1px solid var(--green-pale-border);
    color: var(--green-dark);
    font-weight: 700;
    font-size: 0.95rem;
    padding: 12px 16px;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .dropdown-toggle .arrow { transition: transform 0.15s ease; }
  .dropdown.open .dropdown-toggle .arrow { transform: rotate(180deg); }
  .dropdown-panel {
    display: none;
    background: #fff;
    border: 1px solid var(--card-border);
    border-top: none;
    border-radius: 0 0 10px 10px;
    padding: 12px 14px;
  }
  .dropdown.open .dropdown-panel { display: block; }
  .dropdown.open .dropdown-toggle { border-radius: 10px 10px 0 0; }

  .saved-row, .session-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 4px;
    border-bottom: 1px solid #f0f0f0;
    font-size: 0.92rem;
  }
  .saved-row:last-child, .session-row:last-child { border-bottom: none; }
  .small-btn {
    border: 1px solid var(--card-border);
    background: #fff;
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 0.82rem;
    cursor: pointer;
    color: var(--text);
  }
  .small-btn.add { color: var(--green-dark); border-color: var(--green-pale-border); background: var(--green-pale); }
  .small-btn.remove { color: #c0392b; }
  .inline-form { display: flex; gap: 8px; margin-top: 10px; }
  .inline-form input { flex: 1; }
  .empty-note { color: var(--muted); font-size: 0.88rem; padding: 6px 4px; }

  .config-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-top: 10px;
  }
  .field label {
    display: block;
    font-weight: 700;
    font-size: 0.95rem;
    margin-bottom: 6px;
  }
  .hint {
    font-size: 0.82rem;
    color: var(--muted);
    margin-top: 4px;
  }
  .estimate-box {
    margin-top: 8px;
    background: #fff;
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.85rem;
    color: var(--text);
    line-height: 1.4;
  }
  .estimate-box:empty { display: none; }
  #targetScoreField { margin-top: 14px; }
  #targetScoreField input { max-width: 140px; }

  .courts-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 16px;
    margin-top: 18px;
  }
  .court-field { display: flex; align-items: center; gap: 8px; }
  .court-field span { font-weight: 700; color: var(--muted); }
  .court-field input {
    width: 60px;
    text-align: center;
    padding: 10px 6px;
  }

  .generate-btn {
    width: 100%;
    margin-top: 22px;
    background: var(--green);
    color: #fff;
    font-weight: 700;
    font-size: 1.05rem;
    padding: 16px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
  }
  .generate-btn:hover { background: var(--green-dark); }
  .generate-btn:disabled { background: #d9c79a; cursor: not-allowed; }

  .debug-btn {
    width: 100%;
    margin-top: 12px;
    background: transparent;
    border: 1px dashed var(--card-border);
    color: #9aa3ae;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .debug-btn:hover { color: var(--muted); border-color: #b6bcc4; }

  /* ---- Session (results) view ---- */
  .session-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
  }
  .session-header h2 { margin: 0; color: var(--green-dark); font-size: 1.3rem; }
  .session-links a {
    color: var(--green);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.9rem;
    margin-left: 14px;
    cursor: pointer;
  }
  .session-links a:hover { text-decoration: underline; }

  .info-bar {
    background: var(--green-pale);
    border: 1px solid var(--green-pale-border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.85rem;
    color: var(--green-dark);
    margin-bottom: 18px;
    line-height: 1.4;
  }

  .timer-section { text-align: center; margin: 6px 0 24px; }
  .timer-display { font-size: 3.2rem; font-weight: 800; color: var(--green-dark); line-height: 1; }
  .timer-buttons { display: flex; justify-content: center; gap: 10px; margin-top: 12px; }
  .timer-btn { padding: 10px 26px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 0.95rem; }
  .timer-btn.start { background: var(--green); color: #fff; border: none; }
  .timer-btn.reset { background: #fff; color: var(--text); border: 1px solid var(--card-border); }

  .court-card {
    border: 2px solid var(--green);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 16px;
    background: #fff;
  }
  .court-title {
    text-align: center;
    text-transform: uppercase;
    color: var(--green-dark);
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    margin-bottom: 12px;
  }
  .team-box {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto auto;
    gap: 3px;
    background: #e4d9bc;
    border-radius: 10px;
    overflow: hidden;
  }
  .team-cell {
    background: var(--dark-cell);
    color: #fff;
    font-weight: 700;
    text-align: center;
    padding: 14px 10px;
    font-size: 0.98rem;
  }
  .score-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 10px;
    padding-top: 12px;
    border-top: 1px solid #eee;
    margin-top: 12px;
  }
  .score-row .label-left { text-align: left; color: var(--muted); font-size: 0.85rem; }
  .score-row .label-right { text-align: right; color: var(--muted); font-size: 0.85rem; }
  .score-inputs { display: flex; align-items: center; gap: 8px; justify-content: center; }
  .score-inputs input {
    width: 40px;
    height: 36px;
    text-align: center;
    padding: 0;
    border: 1px solid var(--card-border);
    border-radius: 6px;
  }
  .score-inputs .dash { color: var(--muted); }

  .resting-bar {
    background: #f5ecd9;
    border-radius: 10px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin: 16px 0;
  }
  .resting-bar .label { font-weight: 700; color: #8a6d1f; }
  .resting-pill {
    background: #eddca0;
    color: #7a5b12;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
  }

  .nav-row { display: flex; gap: 10px; margin-bottom: 14px; }
  .nav-btn { flex: 1; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 0.95rem; cursor: pointer; border: none; }
  .nav-btn.prev { background: #dfe3e8; color: #9aa3ae; }
  .nav-btn.prev:disabled { cursor: not-allowed; }
  .nav-btn.next { background: var(--green); color: #fff; }
  .nav-btn.next:disabled { background: #d9c79a; cursor: not-allowed; }

  .outline-btn {
    width: 100%;
    background: var(--green-pale);
    border: 1px solid var(--green-pale-border);
    color: var(--green-dark);
    font-weight: 700;
    padding: 12px 16px;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 10px;
    text-align: center;
    font-size: 0.95rem;
  }

  .panel {
    background: #fff;
    border: 1px solid var(--card-border);
    border-radius: 12px;
    overflow: hidden;
    margin-top: 22px;
  }
  .panel-header {
    background: var(--green-dark);
    color: #fff;
    padding: 12px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 700;
    font-size: 0.82rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    flex-wrap: wrap;
    gap: 4px;
  }
  .table-scroll { overflow-x: auto; }
  table.schedule-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; min-width: 480px; }
  .schedule-table th {
    background: #faf2dc;
    color: var(--green-dark);
    text-transform: uppercase;
    font-size: 0.72rem;
    padding: 10px 12px;
    text-align: left;
    white-space: nowrap;
  }
  .schedule-table td { padding: 10px 12px; vertical-align: top; border-top: 1px solid #f0f0f0; }
  .schedule-table tr:nth-child(even) td { background: #fdf9ef; }
  .schedule-table .vs { text-align: center; color: var(--muted); font-size: 0.72rem; margin: 2px 0; }
  .schedule-table .resting-cell { color: var(--green-dark); font-size: 0.8rem; }

  .games-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding: 16px;
  }
  .game-pill {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid var(--green-pale-border);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 0.85rem;
  }
  .game-pill .name { font-weight: 700; }
  .game-pill .count { background: var(--green); color: #fff; border-radius: 999px; padding: 2px 10px; font-size: 0.72rem; font-weight: 700; white-space: nowrap; }

  @media (max-width: 480px) {
    .config-grid { grid-template-columns: 1fr; }
    .games-grid { grid-template-columns: 1fr; }
  }

  @media print {
    .no-print { display: none !important; }
  }
</style>
</head>
<body>
  <div class="app">
    <h1>Pickleball Scheduler</h1>

    <div id="setupView">
      <label class="section-label">Today's players</label>
      <input type="text" id="playerInput" placeholder="Type a name to add..." />
      <div class="chips" id="todayChips"></div>

      <div class="dropdown" id="pickDropdown">
        <button class="dropdown-toggle" data-target="pickDropdown">
          Pick from all saved players <span class="arrow">▾</span>
        </button>
        <div class="dropdown-panel" id="pickPanel"></div>
      </div>

      <div class="dropdown" id="manageDropdown">
        <button class="dropdown-toggle" data-target="manageDropdown">
          Manage saved names <span class="arrow">▾</span>
        </button>
        <div class="dropdown-panel">
          <div id="managePanel"></div>
          <div class="inline-form">
            <input type="text" id="newSavedName" placeholder="Add a new saved name..." />
            <button class="small-btn add" id="addSavedBtn">Add</button>
          </div>
        </div>
      </div>

      <div class="dropdown" id="sessionsDropdown">
        <button class="dropdown-toggle" data-target="sessionsDropdown">
          Past sessions <span class="arrow">▾</span>
        </button>
        <div class="dropdown-panel" id="sessionsPanel"></div>
      </div>

      <div class="config-grid">
        <div class="field">
          <label for="courtsInput">Courts available</label>
          <input type="number" id="courtsInput" min="1" max="12" value="1" />
        </div>
        <div class="field">
          <label for="gamesToPlayInput">Games to play</label>
          <input type="number" id="gamesToPlayInput" min="0" value="0" />
        </div>
        <div class="field">
          <label for="gameLengthInput">Game length</label>
          <input type="number" id="gameLengthInput" min="0" value="0" />
          <div class="hint">mins</div>
        </div>
        <div class="field">
          <label for="timeAvailableInput">Time available</label>
          <input type="number" id="timeAvailableInput" min="0" value="0" />
        </div>
      </div>

      <div class="estimate-box" id="roundsHint"></div>

      <div class="field" id="targetScoreField" style="display:none;">
        <label for="targetScoreInput">Games to be played to</label>
        <input type="number" id="targetScoreInput" min="1" max="21" value="11" />
        <div class="estimate-box" id="targetScoreHint"></div>
      </div>

      <div class="courts-row" id="courtLabelsRow"></div>

      <button class="generate-btn" id="generateBtn">Generate Schedule</button>
      <button class="debug-btn" id="debugBtn">Debug: fill 15 names</button>
    </div>

    <div id="sessionView" style="display:none;">
      <div class="session-header">
        <h2 id="roundHeader">Round 1 / 1</h2>
        <div class="session-links">
          <a id="editPlayersLink">Edit players</a>
          <a id="startOverLink">Start Over</a>
        </div>
      </div>

      <div class="info-bar" id="infoBar"></div>

      <div class="timer-section no-print">
        <div class="timer-display" id="timerDisplay">10:00</div>
        <div class="timer-buttons">
          <button class="timer-btn start" id="timerStartBtn">Start</button>
          <button class="timer-btn reset" id="timerResetBtn">Reset</button>
        </div>
      </div>

      <div id="courtsContainer"></div>

      <div class="resting-bar" id="restingBar"></div>

      <div class="nav-row no-print">
        <button class="nav-btn prev" id="prevBtn">&larr; Prev</button>
        <button class="nav-btn next" id="nextBtn">Next &rarr;</button>
      </div>

      <button class="outline-btn no-print" id="printBtn">Print / Save as PDF</button>
      <button class="outline-btn no-print" id="regenerateBtn">Regenerate Schedule</button>

      <div class="panel">
        <div class="panel-header">
          <span>Full Schedule</span>
          <span id="fullScheduleMeta"></span>
        </div>
        <div class="table-scroll">
          <table class="schedule-table" id="fullScheduleTable"></table>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header"><span>Games Played</span></div>
        <div class="games-grid" id="gamesGrid"></div>
      </div>
    </div>
  </div>

<script>
(function () {
  const STORAGE = {
    saved: "pbs_savedPlayers",
    sessions: "pbs_pastSessions",
    today: "pbs_todayPlayers",
    config: "pbs_config",
  };

  function load(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) {
      return fallback;
    }
  }
  function save(key, value) {
    localStorage.setItem(key, JSON.stringify(value));
  }

  const CHANGEOVER_MINUTES = 2;

  let todayPlayers = load(STORAGE.today, []);
  let savedPlayers = load(STORAGE.saved, []);
  let pastSessions = load(STORAGE.sessions, []);
  const CONFIG_SCHEMA_VERSION = 2;
  let config = load(STORAGE.config, {
    courts: 1,
    gamesToPlay: 0,
    gameLength: 0,
    timeAvailable: 0,
    targetScore: 11,
    courtLabels: ["1"],
    schemaVersion: CONFIG_SCHEMA_VERSION,
  });
  config.gamesToPlay = config.gamesToPlay ?? 0;
  config.targetScore = config.targetScore ?? 11;
  if ((config.schemaVersion || 1) < CONFIG_SCHEMA_VERSION) {
    // One-time migration: browsers with settings saved before the
    // "games to play" mode existed get bumped onto the new defaults.
    config.courts = 1;
    config.gameLength = 0;
    config.timeAvailable = 0;
    config.courtLabels = ["1"];
    config.schemaVersion = CONFIG_SCHEMA_VERSION;
    save(STORAGE.config, config);
  }

  let currentSession = null;
  let currentRoundIndex = 0;
  let timerSeconds = 0;
  let timerInterval = null;

  const setupView = document.getElementById("setupView");
  const sessionView = document.getElementById("sessionView");

  const playerInput = document.getElementById("playerInput");
  const todayChips = document.getElementById("todayChips");
  const pickPanel = document.getElementById("pickPanel");
  const managePanel = document.getElementById("managePanel");
  const sessionsPanel = document.getElementById("sessionsPanel");
  const courtsInput = document.getElementById("courtsInput");
  const gamesToPlayInput = document.getElementById("gamesToPlayInput");
  const gameLengthInput = document.getElementById("gameLengthInput");
  const timeAvailableInput = document.getElementById("timeAvailableInput");
  const roundsHint = document.getElementById("roundsHint");
  const targetScoreField = document.getElementById("targetScoreField");
  const targetScoreInput = document.getElementById("targetScoreInput");
  const targetScoreHint = document.getElementById("targetScoreHint");
  const courtLabelsRow = document.getElementById("courtLabelsRow");
  const generateBtn = document.getElementById("generateBtn");
  const debugBtn = document.getElementById("debugBtn");
  const newSavedName = document.getElementById("newSavedName");
  const addSavedBtn = document.getElementById("addSavedBtn");

  const roundHeader = document.getElementById("roundHeader");
  const editPlayersLink = document.getElementById("editPlayersLink");
  const startOverLink = document.getElementById("startOverLink");
  const infoBar = document.getElementById("infoBar");
  const timerDisplay = document.getElementById("timerDisplay");
  const timerStartBtn = document.getElementById("timerStartBtn");
  const timerResetBtn = document.getElementById("timerResetBtn");
  const courtsContainer = document.getElementById("courtsContainer");
  const restingBar = document.getElementById("restingBar");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const printBtn = document.getElementById("printBtn");
  const regenerateBtn = document.getElementById("regenerateBtn");
  const fullScheduleMeta = document.getElementById("fullScheduleMeta");
  const fullScheduleTable = document.getElementById("fullScheduleTable");
  const gamesGrid = document.getElementById("gamesGrid");

  courtsInput.value = config.courts;
  gamesToPlayInput.value = config.gamesToPlay;
  gameLengthInput.value = config.gameLength;
  timeAvailableInput.value = config.timeAvailable;
  targetScoreInput.value = config.targetScore;

  // Estimated minutes for a game played to a given target score.
  // Anchored to known reference points (7->8, 9->12, 11->15, 15->20 mins,
  // matching common recreational/tournament pool-play timing) and linearly
  // interpolated/extrapolated for every other value from 1 to 21.
  function estimateMinutesForTarget(target) {
    const points = [[7, 8], [9, 12], [11, 15], [15, 20]];
    const t = Math.max(1, Math.min(21, target));
    if (t <= points[0][0]) {
      const [x0, y0] = points[0];
      const [x1, y1] = points[1];
      const slope = (y1 - y0) / (x1 - x0);
      return Math.max(3, Math.round(y0 + slope * (t - x0)));
    }
    if (t >= points[points.length - 1][0]) {
      const [x0, y0] = points[points.length - 2];
      const [x1, y1] = points[points.length - 1];
      const slope = (y1 - y0) / (x1 - x0);
      return Math.ceil(y1 + slope * (t - x1));
    }
    for (let i = 0; i < points.length - 1; i++) {
      const [x0, y0] = points[i];
      const [x1, y1] = points[i + 1];
      if (t >= x0 && t <= x1) {
        const slope = (y1 - y0) / (x1 - x0);
        return Math.round(y0 + slope * (t - x0));
      }
    }
    return 15;
  }

  function isGamesMode() {
    return (parseInt(gamesToPlayInput.value, 10) || 0) > 0;
  }

  function computeRounds() {
    const len = Math.max(0, parseInt(gameLengthInput.value, 10) || 0);
    const time = Math.max(0, parseInt(timeAvailableInput.value, 10) || 0);
    if (len <= 0 || time <= 0) return 0;
    return Math.max(1, Math.floor(time / (len + CHANGEOVER_MINUTES)));
  }

  function updateRoundsHint() {
    if (isGamesMode()) {
      roundsHint.textContent = "";
      return;
    }
    const rounds = computeRounds();
    roundsHint.textContent = rounds > 0
      ? `${rounds} round${rounds === 1 ? "" : "s"} total, incl. ${CHANGEOVER_MINUTES} min changeover per game`
      : "";
  }

  function updateGamesModeUI() {
    const gamesToPlay = Math.max(0, parseInt(gamesToPlayInput.value, 10) || 0);
    const gamesMode = gamesToPlay > 0;
    targetScoreField.style.display = gamesMode ? "block" : "none";
    if (gamesMode) {
      const target = Math.max(1, Math.min(21, parseInt(targetScoreInput.value, 10) || 11));
      const perGame = estimateMinutesForTarget(target);
      const total = gamesToPlay * (perGame + CHANGEOVER_MINUTES);
      targetScoreHint.textContent =
        `~${perGame} min/game + ${CHANGEOVER_MINUTES} min changeover · ~${total} min total for ${gamesToPlay} game${gamesToPlay === 1 ? "" : "s"}`;
    } else {
      targetScoreHint.textContent = "";
    }
    updateRoundsHint();
  }

  function persistConfig() {
    config.courts = Math.max(1, parseInt(courtsInput.value, 10) || 1);
    config.gamesToPlay = Math.max(0, parseInt(gamesToPlayInput.value, 10) || 0);
    config.gameLength = Math.max(0, parseInt(gameLengthInput.value, 10) || 0);
    config.timeAvailable = Math.max(0, parseInt(timeAvailableInput.value, 10) || 0);
    config.targetScore = Math.max(1, Math.min(21, parseInt(targetScoreInput.value, 10) || 11));
    save(STORAGE.config, config);
  }

  function renderCourtLabels() {
    const n = Math.max(1, parseInt(courtsInput.value, 10) || 1);
    const labels = config.courtLabels || [];
    while (labels.length < n) labels.push(String(labels.length + 1));
    labels.length = n;
    config.courtLabels = labels;

    courtLabelsRow.innerHTML = "";
    labels.forEach((label, i) => {
      const wrap = document.createElement("div");
      wrap.className = "court-field";
      const span = document.createElement("span");
      span.textContent = "Court";
      const input = document.createElement("input");
      input.type = "text";
      input.value = label;
      input.addEventListener("input", () => {
        config.courtLabels[i] = input.value || String(i + 1);
        save(STORAGE.config, config);
      });
      wrap.appendChild(span);
      wrap.appendChild(input);
      courtLabelsRow.appendChild(wrap);
    });
  }

  function renderTodayChips() {
    todayChips.innerHTML = "";
    todayPlayers.forEach((name, i) => {
      const chip = document.createElement("div");
      chip.className = "chip";
      const span = document.createElement("span");
      span.textContent = name;
      const btn = document.createElement("button");
      btn.textContent = "×";
      btn.title = "Remove";
      btn.addEventListener("click", () => {
        todayPlayers.splice(i, 1);
        save(STORAGE.today, todayPlayers);
        renderTodayChips();
        renderPickPanel();
      });
      chip.appendChild(span);
      chip.appendChild(btn);
      todayChips.appendChild(chip);
    });
  }

  function addTodayPlayer(name) {
    name = name.trim();
    if (!name) return;
    if (todayPlayers.some((p) => p.toLowerCase() === name.toLowerCase())) return;
    todayPlayers.push(name);
    save(STORAGE.today, todayPlayers);
    renderTodayChips();
    renderPickPanel();
  }

  playerInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      addTodayPlayer(playerInput.value);
      playerInput.value = "";
    }
  });

  function renderPickPanel() {
    pickPanel.innerHTML = "";
    const available = savedPlayers.filter(
      (p) => !todayPlayers.some((t) => t.toLowerCase() === p.toLowerCase())
    );
    if (available.length === 0) {
      const note = document.createElement("div");
      note.className = "empty-note";
      note.textContent = savedPlayers.length === 0
        ? "No saved players yet. Add some in \"Manage saved names\"."
        : "All saved players are already in today's list.";
      pickPanel.appendChild(note);
      return;
    }
    available.forEach((name) => {
      const row = document.createElement("div");
      row.className = "saved-row";
      const span = document.createElement("span");
      span.textContent = name;
      const btn = document.createElement("button");
      btn.className = "small-btn add";
      btn.textContent = "Add";
      btn.addEventListener("click", () => addTodayPlayer(name));
      row.appendChild(span);
      row.appendChild(btn);
      pickPanel.appendChild(row);
    });
  }

  function renderManagePanel() {
    managePanel.innerHTML = "";
    if (savedPlayers.length === 0) {
      const note = document.createElement("div");
      note.className = "empty-note";
      note.textContent = "No saved names yet.";
      managePanel.appendChild(note);
      return;
    }
    savedPlayers.forEach((name, i) => {
      const row = document.createElement("div");
      row.className = "saved-row";
      const span = document.createElement("span");
      span.textContent = name;
      const btn = document.createElement("button");
      btn.className = "small-btn remove";
      btn.textContent = "Remove";
      btn.addEventListener("click", () => {
        savedPlayers.splice(i, 1);
        save(STORAGE.saved, savedPlayers);
        renderManagePanel();
        renderPickPanel();
      });
      row.appendChild(span);
      row.appendChild(btn);
      managePanel.appendChild(row);
    });
  }

  addSavedBtn.addEventListener("click", () => {
    const name = newSavedName.value.trim();
    if (!name) return;
    if (savedPlayers.some((p) => p.toLowerCase() === name.toLowerCase())) {
      newSavedName.value = "";
      return;
    }
    savedPlayers.push(name);
    save(STORAGE.saved, savedPlayers);
    newSavedName.value = "";
    renderManagePanel();
    renderPickPanel();
  });
  newSavedName.addEventListener("keydown", (e) => {
    if (e.key === "Enter") addSavedBtn.click();
  });

  function renderSessionsPanel() {
    sessionsPanel.innerHTML = "";
    if (pastSessions.length === 0) {
      const note = document.createElement("div");
      note.className = "empty-note";
      note.textContent = "No past sessions yet.";
      sessionsPanel.appendChild(note);
      return;
    }
    [...pastSessions].reverse().forEach((session) => {
      const row = document.createElement("div");
      row.className = "session-row";
      const span = document.createElement("span");
      span.textContent = `${session.date} — ${session.players.length} players, ${session.rounds.length} rounds`;
      const btnGroup = document.createElement("div");
      btnGroup.style.display = "flex";
      btnGroup.style.gap = "6px";
      const viewBtn = document.createElement("button");
      viewBtn.className = "small-btn";
      viewBtn.textContent = "View";
      viewBtn.addEventListener("click", () => {
        currentSession = session;
        currentRoundIndex = 0;
        showSessionView();
        renderAll();
      });
      const delBtn = document.createElement("button");
      delBtn.className = "small-btn remove";
      delBtn.textContent = "Delete";
      delBtn.addEventListener("click", () => {
        pastSessions = pastSessions.filter((s) => s.id !== session.id);
        save(STORAGE.sessions, pastSessions);
        renderSessionsPanel();
      });
      btnGroup.appendChild(viewBtn);
      btnGroup.appendChild(delBtn);
      row.appendChild(span);
      row.appendChild(btnGroup);
      sessionsPanel.appendChild(row);
    });
  }

  document.querySelectorAll(".dropdown-toggle").forEach((btn) => {
    btn.addEventListener("click", () => {
      const dropdown = document.getElementById(btn.dataset.target);
      const isOpen = dropdown.classList.contains("open");
      document.querySelectorAll(".dropdown.open").forEach((d) => d.classList.remove("open"));
      if (!isOpen) dropdown.classList.add("open");
    });
  });

  courtsInput.addEventListener("input", () => {
    persistConfig();
    renderCourtLabels();
  });
  gamesToPlayInput.addEventListener("input", () => {
    persistConfig();
    updateGamesModeUI();
  });
  gameLengthInput.addEventListener("input", () => {
    persistConfig();
    updateRoundsHint();
  });
  timeAvailableInput.addEventListener("input", () => {
    persistConfig();
    updateRoundsHint();
  });
  targetScoreInput.addEventListener("input", () => {
    persistConfig();
    updateGamesModeUI();
  });

  debugBtn.addEventListener("click", () => {
    const sample = [
      "Alice", "Bob", "Charlie", "Dave", "Eve", "Frank", "Grace", "Hank",
      "Ivy", "Jack", "Kate", "Liam", "Mia", "Nick", "Olivia",
    ];
    sample.forEach(addTodayPlayer);
  });

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function pairKey(a, b) {
    return [a, b].sort().join("|");
  }

  function bestTeamSplit(group, partnerCount) {
    const splits = [
      { teamA: [group[0], group[1]], teamB: [group[2], group[3]] },
      { teamA: [group[0], group[2]], teamB: [group[1], group[3]] },
      { teamA: [group[0], group[3]], teamB: [group[1], group[2]] },
    ];
    let best = null;
    let bestScore = Infinity;
    for (const split of splits) {
      const score =
        (partnerCount[pairKey(split.teamA[0], split.teamA[1])] || 0) +
        (partnerCount[pairKey(split.teamB[0], split.teamB[1])] || 0);
      if (score < bestScore) {
        bestScore = score;
        best = split;
      }
    }
    return { split: best, score: bestScore };
  }

  function generateRounds(players, numRounds, courtsCount, courtLabels) {
    const partnerCount = {};
    const opponentCount = {};
    const sitCount = {};
    const lastRestRound = {};
    players.forEach((p) => {
      sitCount[p] = 0;
      lastRestRound[p] = -1;
    });
    const rounds = [];
    const actualCourts = Math.min(courtsCount, Math.floor(players.length / 4));

    for (let r = 0; r < numRounds; r++) {
      const n = players.length;
      if (actualCourts === 0) break;
      const needed = actualCourts * 4;
      const sitOutNeeded = n - needed;

      const tiebreak = {};
      players.forEach((p) => (tiebreak[p] = Math.random()));
      const orderedBySit = [...players].sort((a, b) => {
        if (sitCount[a] !== sitCount[b]) return sitCount[a] - sitCount[b];
        if (lastRestRound[a] !== lastRestRound[b]) return lastRestRound[a] - lastRestRound[b];
        return tiebreak[a] - tiebreak[b];
      });
      const sittingOut = orderedBySit.slice(0, sitOutNeeded);
      const playing = orderedBySit.slice(sitOutNeeded);
      sittingOut.forEach((p) => {
        sitCount[p] += 1;
        lastRestRound[p] = r;
      });

      let bestGrouping = null;
      let bestScore = Infinity;
      for (let attempt = 0; attempt < 150; attempt++) {
        const shuffled = shuffle(playing);
        const groups = [];
        for (let i = 0; i < actualCourts; i++) {
          groups.push(shuffled.slice(i * 4, i * 4 + 4));
        }
        const results = groups.map((g) => bestTeamSplit(g, partnerCount));
        const totalScore = results.reduce((sum, res) => sum + res.score, 0);
        if (totalScore < bestScore) {
          bestScore = totalScore;
          bestGrouping = results;
        }
        if (bestScore === 0) break;
      }

      bestGrouping.forEach((res) => {
        const { teamA, teamB } = res.split;
        const key1 = pairKey(teamA[0], teamA[1]);
        const key2 = pairKey(teamB[0], teamB[1]);
        partnerCount[key1] = (partnerCount[key1] || 0) + 1;
        partnerCount[key2] = (partnerCount[key2] || 0) + 1;
        teamA.forEach((a) => {
          teamB.forEach((b) => {
            const k = pairKey(a, b);
            opponentCount[k] = (opponentCount[k] || 0) + 1;
          });
        });
      });

      const courts = bestGrouping.map((res, i) => ({
        label: courtLabels[i] || String(i + 1),
        teamA: res.split.teamA,
        teamB: res.split.teamB,
        scoreA: "",
        scoreB: "",
      }));

      rounds.push({ round: r + 1, courts, sitOuts: sittingOut });
    }

    const maxPartner = Object.values(partnerCount).reduce((m, v) => Math.max(m, v), 0);
    const maxOpponent = Object.values(opponentCount).reduce((m, v) => Math.max(m, v), 0);

    return { rounds, actualCourts, maxPartner, maxOpponent };
  }

  function showSetupView() {
    stopTimer();
    setupView.style.display = "block";
    sessionView.style.display = "none";
  }
  function showSessionView() {
    setupView.style.display = "none";
    sessionView.style.display = "block";
  }

  function stopTimer() {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
    timerStartBtn.textContent = "Start";
  }

  function resetTimer() {
    stopTimer();
    timerSeconds = (currentSession ? currentSession.config.gameLength : 10) * 60;
    updateTimerDisplay();
  }

  function updateTimerDisplay() {
    const m = Math.floor(timerSeconds / 60);
    const s = timerSeconds % 60;
    timerDisplay.textContent = `${m}:${String(s).padStart(2, "0")}`;
  }

  timerStartBtn.addEventListener("click", () => {
    if (timerInterval) {
      stopTimer();
      return;
    }
    timerStartBtn.textContent = "Pause";
    timerInterval = setInterval(() => {
      if (timerSeconds <= 0) {
        stopTimer();
        return;
      }
      timerSeconds -= 1;
      updateTimerDisplay();
    }, 1000);
  });
  timerResetBtn.addEventListener("click", resetTimer);

  function updateSessionInStorage() {
    const idx = pastSessions.findIndex((s) => s.id === currentSession.id);
    if (idx !== -1) {
      pastSessions[idx] = currentSession;
      save(STORAGE.sessions, pastSessions);
    }
  }

  function renderInfoBar() {
    const s = currentSession;
    const avgActive = ((s.rounds.length * s.actualCourts * 4) / s.players.length).toFixed(1);
    const gameDesc = s.config.gamesToPlay > 0
      ? `${s.config.gameLength} min games (to ${s.config.targetScore})`
      : `${s.config.gameLength} min games`;
    infoBar.textContent =
      `${s.players.length} players · ${s.actualCourts} courts · ${gameDesc} · ` +
      `${s.rounds.length} rounds · ~${avgActive} active each · ` +
      `Max repeat partner: ${s.maxPartner} · Max repeat opponent: ${s.maxOpponent}`;
  }

  function renderRound() {
    const s = currentSession;
    const round = s.rounds[currentRoundIndex];
    roundHeader.textContent = `Round ${currentRoundIndex + 1} / ${s.rounds.length}`;

    courtsContainer.innerHTML = "";
    round.courts.forEach((court) => {
      const card = document.createElement("div");
      card.className = "court-card";

      const title = document.createElement("div");
      title.className = "court-title";
      title.textContent = `Court ${court.label}`;
      card.appendChild(title);

      const teamBox = document.createElement("div");
      teamBox.className = "team-box";
      [court.teamA[0], court.teamB[0], court.teamA[1], court.teamB[1]].forEach((name) => {
        const cell = document.createElement("div");
        cell.className = "team-cell";
        cell.textContent = name;
        teamBox.appendChild(cell);
      });
      card.appendChild(teamBox);

      const scoreRow = document.createElement("div");
      scoreRow.className = "score-row";
      const labelLeft = document.createElement("div");
      labelLeft.className = "label-left";
      labelLeft.textContent = court.teamA.join(" & ");
      const inputs = document.createElement("div");
      inputs.className = "score-inputs";
      const scoreA = document.createElement("input");
      scoreA.type = "number";
      scoreA.value = court.scoreA;
      scoreA.addEventListener("input", () => {
        court.scoreA = scoreA.value;
        updateSessionInStorage();
      });
      const dash = document.createElement("span");
      dash.className = "dash";
      dash.textContent = "—";
      const scoreB = document.createElement("input");
      scoreB.type = "number";
      scoreB.value = court.scoreB;
      scoreB.addEventListener("input", () => {
        court.scoreB = scoreB.value;
        updateSessionInStorage();
      });
      inputs.appendChild(scoreA);
      inputs.appendChild(dash);
      inputs.appendChild(scoreB);
      const labelRight = document.createElement("div");
      labelRight.className = "label-right";
      labelRight.textContent = court.teamB.join(" & ");
      scoreRow.appendChild(labelLeft);
      scoreRow.appendChild(inputs);
      scoreRow.appendChild(labelRight);
      card.appendChild(scoreRow);

      courtsContainer.appendChild(card);
    });

    restingBar.innerHTML = "";
    if (round.sitOuts.length) {
      const label = document.createElement("span");
      label.className = "label";
      label.textContent = "Resting:";
      restingBar.appendChild(label);
      round.sitOuts.forEach((name) => {
        const pill = document.createElement("span");
        pill.className = "resting-pill";
        pill.textContent = name;
        restingBar.appendChild(pill);
      });
      restingBar.style.display = "flex";
    } else {
      restingBar.style.display = "none";
    }

    prevBtn.disabled = currentRoundIndex === 0;
    nextBtn.disabled = currentRoundIndex === s.rounds.length - 1;

    resetTimer();
  }

  function renderFullSchedule() {
    const s = currentSession;
    fullScheduleMeta.textContent = `${s.players.length} PLAYERS · ${s.actualCourts} COURTS`;
    let html = "<thead><tr><th>#</th>";
    for (let i = 0; i < s.actualCourts; i++) {
      html += `<th>Court ${s.config.courtLabels[i] || i + 1}</th>`;
    }
    html += "<th>Resting</th></tr></thead><tbody>";
    s.rounds.forEach((round) => {
      html += `<tr><td>${round.round}</td>`;
      round.courts.forEach((court) => {
        html += `<td>${court.teamA.join(" & ")}<div class="vs">vs</div>${court.teamB.join(" & ")}</td>`;
      });
      html += `<td class="resting-cell">${round.sitOuts.join(", ")}</td></tr>`;
    });
    html += "</tbody>";
    fullScheduleTable.innerHTML = html;
  }

  function renderGamesPlayed() {
    const s = currentSession;
    const gamesCount = {};
    s.players.forEach((p) => (gamesCount[p] = 0));
    s.rounds.forEach((round) => {
      round.courts.forEach((court) => {
        [...court.teamA, ...court.teamB].forEach((p) => (gamesCount[p] += 1));
      });
    });
    const sortedNames = [...s.players].sort((a, b) => a.localeCompare(b));
    gamesGrid.innerHTML = "";
    sortedNames.forEach((name) => {
      const pill = document.createElement("div");
      pill.className = "game-pill";
      const nameSpan = document.createElement("span");
      nameSpan.className = "name";
      nameSpan.textContent = name;
      const count = document.createElement("span");
      count.className = "count";
      count.textContent = `${gamesCount[name]} games`;
      pill.appendChild(nameSpan);
      pill.appendChild(count);
      gamesGrid.appendChild(pill);
    });
  }

  function renderAll() {
    renderInfoBar();
    renderRound();
    renderFullSchedule();
    renderGamesPlayed();
  }

  prevBtn.addEventListener("click", () => {
    if (currentRoundIndex > 0) {
      currentRoundIndex -= 1;
      renderRound();
    }
  });
  nextBtn.addEventListener("click", () => {
    if (currentRoundIndex < currentSession.rounds.length - 1) {
      currentRoundIndex += 1;
      renderRound();
    }
  });

  printBtn.addEventListener("click", () => window.print());

  editPlayersLink.addEventListener("click", showSetupView);

  startOverLink.addEventListener("click", () => {
    if (!confirm("Start over? This clears today's players list.")) return;
    todayPlayers = [];
    save(STORAGE.today, todayPlayers);
    currentSession = null;
    renderTodayChips();
    renderPickPanel();
    showSetupView();
  });

  function buildAndShowSession() {
    if (todayPlayers.length < 4) {
      alert("Add at least 4 players to generate a schedule.");
      return false;
    }
    persistConfig();

    let numRounds, effectiveGameLength;
    if (config.gamesToPlay > 0) {
      numRounds = config.gamesToPlay;
      effectiveGameLength = estimateMinutesForTarget(config.targetScore);
    } else {
      if (config.gameLength <= 0 || config.timeAvailable <= 0) {
        alert("Enter either a number of games to play, or a game length and time available.");
        return false;
      }
      numRounds = computeRounds();
      effectiveGameLength = config.gameLength;
    }

    const { rounds, actualCourts, maxPartner, maxOpponent } = generateRounds(
      todayPlayers, numRounds, config.courts, config.courtLabels
    );
    if (rounds.length === 0) {
      alert("Not enough players for even one court (need at least 4).");
      return false;
    }
    currentSession = {
      id: `${pastSessions.length}-${todayPlayers.length}-${rounds.length}-${Math.random().toString(36).slice(2, 8)}`,
      date: new Date().toLocaleString(),
      players: todayPlayers.slice(),
      config: { ...config, courtLabels: config.courtLabels.slice(), gameLength: effectiveGameLength },
      actualCourts,
      maxPartner,
      maxOpponent,
      rounds,
    };
    currentRoundIndex = 0;
    pastSessions.push(currentSession);
    save(STORAGE.sessions, pastSessions);
    renderSessionsPanel();
    showSessionView();
    renderAll();
    return true;
  }

  generateBtn.addEventListener("click", buildAndShowSession);

  regenerateBtn.addEventListener("click", () => {
    const prevPlayers = todayPlayers;
    todayPlayers = currentSession.players.slice();
    config = { ...currentSession.config, courtLabels: currentSession.config.courtLabels.slice() };
    buildAndShowSession();
    todayPlayers = prevPlayers;
  });

  renderTodayChips();
  renderPickPanel();
  renderManagePanel();
  renderSessionsPanel();
  renderCourtLabels();
  updateGamesModeUI();
})();
</script>
</body>
</html>
